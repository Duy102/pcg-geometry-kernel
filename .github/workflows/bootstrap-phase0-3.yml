name: Bootstrap Phase 0-3 source

on:
  push:
    branches:
      - phase0-3-abcabc

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase0-3-abcabc
      - name: Reassemble and verify reviewed source archive
        run: |
          set -euo pipefail
          cat phase0-3-source.b64.* > /tmp/pcg-phase0-3.b64
          base64 -d /tmp/pcg-phase0-3.b64 > /tmp/pcg-phase0-3.zip
          echo "9c02c915fd689b60640531710c0c690ff40dfd95dbb46a4333d532973a9bad61  /tmp/pcg-phase0-3.zip" | sha256sum -c -
          unzip -tq /tmp/pcg-phase0-3.zip
      - name: Expand reviewed Phase 0-3 source
        run: |
          set -euo pipefail
          rm -rf /tmp/pcg-phase0-3
          mkdir -p /tmp/pcg-phase0-3
          unzip -q /tmp/pcg-phase0-3.zip -d /tmp/pcg-phase0-3
          rsync -a --exclude=README.md --exclude=.github/ /tmp/pcg-phase0-3/pcg-geometry-kernel/ ./
          sed -i 's#  /mnt/data/#  #' docs/source-digests.txt
          rm -f phase0-3-source.b64.*
      - name: Commit expanded source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: publish certified ABCABC Phase 0-3 vertical slice"
          git push origin HEAD:phase0-3-abcabc
